# folder to store log, change it if you're not using Linux
logging.path=${java.io.tmpdir}/logs

# screen size on application launch
screen.height=768
screen.width=1024

# these are the color codes used for some panels of the application
# see https://fr.wikipedia.org/wiki/Liste_de_noms_de_couleur
# blond venitien
color.error=231:168:84
# amande
color.success=130:196:108
# blanc cassé
color.input=254:254:226
# gris perle
color.default.result=206:206:206

# identation factor (default values are fine)
json.identFactor=5
xml.identFactor=4

csv.separator=;

# these default values are used when converting a json to xml
xml.default.header=<?xml version="1.0" encoding="UTF-8"?>
xml.default.root=<root>